<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог настільних ігор</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Каталог настільних ігор</h1>
        <nav>
            <a href="#filters">Фільтри</a>
            <a href="#games">Ігри</a>
        </nav>
    </header>

    <main>
        <section id="filters">
            <h2>Фільтри</h2>
            <form>
                <label for="search-input">Пошук гри за назвою:</label>
                <input type="text" id="search-input" name="search">
            </form>
        </section>

        <section id="games">
            <h2>Ігри</h2>
            <article>
                <h3>Квиток на потяг (Ticket to Ride)</h3>
                <img src="assets/img/ticket-to-ride.jpg" alt="Настільна гра Квиток на потяг">
            </article>
            <article>
                <h3>Каркассон (Carcassonne)</h3>
                <img src="assets/img/carcassonne.jpg" alt="Настільна гра Каркассон">
            </article>
        </section>
    </main>

    <footer>
        <p>Авторство: Стаднік Н.А. Навчальний проєкт, 2026 рік.</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
